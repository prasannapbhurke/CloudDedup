<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CloudDedup</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Application CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
    }
    .auth-logo {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.75rem;
      margin: 0 auto 1.25rem;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.35);
    }
  </style>
</head>
<body>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-logo">
        <i class="bi bi-cloud-check-fill"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Sign in to CloudDedup</h3>
      <p class="text-secondary small">Cloud-Based File Deduplication & Storage Optimization</p>
    </div>

    <div id="authAlert" class="alert alert-danger d-none py-2 small" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="loginEmail" class="form-label small fw-semibold text-secondary">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control border-start-0" id="loginEmail" placeholder="student@example.com" required>
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="loginPassword" class="form-label small fw-semibold text-secondary mb-0">Password</label>
          <a href="/forgot-password" class="small text-decoration-none text-primary">Forgot Password?</a>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control border-start-0" id="loginPassword" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mt-2" id="loginBtn">
        <span id="loginBtnText">Sign In</span>
        <span id="loginBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
      </button>
    </form>


    <div class="text-center mt-4 pt-2 border-top">
      <p class="small text-secondary mb-0">
        Don't have an account? <a href="/register" class="text-primary fw-semibold text-decoration-none">Create one</a>
      </p>
    </div>
  </div>

  <!-- Bootstrap 5.3 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Firebase Web SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='js/firebase-config.js') }}"></script>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
