services:
  - type: web
    name: clouddedup
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: USE_SQLITE
        value: "1"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        value: clouddedup-project
      - key: FIREBASE_STORAGE_BUCKET
        value: clouddedup-project.firebasestorage.app
